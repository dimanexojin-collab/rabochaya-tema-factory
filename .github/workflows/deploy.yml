name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# По умолчанию только чтение; нужные права выдаются отдельным задачам ниже.
permissions:
  contents: read

concurrency:
  group: pages
  # как в шаблоне GitHub Pages: не обрывать уже идущую публикацию (иначе сайт может остаться полуобновлённым)
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      # Проектный сайт: https://<owner>.github.io/rabochaya-tema-factory/ (корень аккаунта занят kontur).
      # При переезде на свой домен: SITE=https://домен, BASE=/ — код не меняется.
      SITE: https://${{ github.repository_owner }}.github.io
      BASE: /rabochaya-tema-factory/
    steps:
      # Версии закреплены по отпечатку коммита (защита от подмены метки). Обновляет Dependabot.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # не оставлять токен в .git/config на время сборки (npm-пакеты не смогут его прочитать)
          persist-credentials: false
      - uses: withastro/action@56781b97402ce0487b7e61ce2cb960c0e2cc5289 # v3.0.2
        with:
          node-version: 22

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
